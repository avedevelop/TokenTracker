name: Windows Release

on:
  push:
    tags:
      - "win-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: windows

      - name: Run tests
        run: |
          npm test
          cd src-tauri
          cargo test
        working-directory: windows

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: windows
          tagName: ${{ github.ref_name }}
          releaseName: "TokenTracker for Windows ${{ github.ref_name }}"
          releaseDraft: false
          includeUpdaterJson: true

  publish-update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download latest.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --output windows/latest.json --clobber

      - name: Commit update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windows/latest.json
          git diff --cached --quiet || git commit -m "ci: update windows update manifest for ${{ github.ref_name }}"
          git push origin main
