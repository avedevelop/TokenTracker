[package]
name = "tokentracker"
version = "0.1.0"
description = "A Tauri App"
authors = ["bvsmma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tokentracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
dirs = "6.0.0"
thiserror = "2.0.18"
notify-debouncer-mini = "0.7.0"
# `keyring` registers the platform-native credential store (Windows Credential Manager / macOS Keychain)
# into `keyring_core`'s DEFAULT_STORE via `keyring::use_native_store`.
# `keyring-core` provides the `Entry` type used for actual get/set operations.
keyring = "4.0.1"
keyring-core = "1.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-positioner = { version = "2.3.2", features = ["tray-icon"] }
sys-locale = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"

